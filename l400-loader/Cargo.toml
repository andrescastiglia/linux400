[package]
name = "l400-loader"
version = "0.2.0"
edition = "2024"

[dependencies]
aya = "0.13.1"
aya-log = "0.2.1"
env_logger = "0.11"
log = "0.4"
tokio = { version = "1.52", features = ["macros", "rt", "rt-multi-thread", "signal", "time"] }
anyhow = "1.0"
libc = "0.2"
xattr = "1.6"
l400-ebpf-common = { path = "../l400-ebpf-common" }
l400 = { path = "../libl400" }
clap = { version = "4.6", features = ["derive", "env"] }
