[package]
name = "l400"
version = "0.2.0"
edition = "2024"
build = "build.rs"

[lib]
crate-type = ["staticlib", "rlib"]

[features]
default = []
berkeleydb = []

[dependencies]
xattr = "1.6"
thiserror = "2.0"
l400-ebpf-common = { path = "../l400-ebpf-common" }
sled = "0.34"
rustix = { version = "1.1", features = ["fs", "std"] }
libc = "0.2"
clap = { version = "4.6", features = ["derive"] }
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cc = "1.2"
