name: Develop CI

on:
  push:
    branches:
      - develop

jobs:
  test:
    name: Tests + smoke
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libattr1-dev \
            xattr

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Clippy (libl400)
        run: cargo clippy -p l400 --all-targets -- -D warnings

      - name: Run tests (libl400)
        run: cargo test -p l400 --verbose -- --test-threads=1

      - name: Run tests (CL compiler)
        run: cargo test -p clc --verbose

      - name: Run tests (TUI)
        run: cargo test -p os400-tui --verbose

      - name: Build user-space tools
        run: |
          cargo build -p c400c
          cargo build -p clc
          cargo build -p l400-loader
          cargo build -p os400-tui

      - name: Build userspace package
        run: bash scripts/build/build_userspace.sh
        env:
          OUTPUT_DIR: ${{ github.workspace }}/output
          L400_SRC_DIR: ${{ github.workspace }}

      - name: Runtime smoke scripts
        run: |
          bash scripts/test/test_objects_v1_demo.sh
          bash scripts/test/test_toolchain_v1_demo.sh
          bash scripts/test/test_workload_demo.sh
          bash scripts/test/test_loader_modes.sh
          bash scripts/test/test_support_profile.sh

      - name: Build eBPF when toolchain is available
        run: bash scripts/test/test_ebpf_build_optional.sh
